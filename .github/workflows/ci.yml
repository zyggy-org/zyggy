# Deliverable 01 — the RGR-Proof PROVE loop on both runners, plus a single-file publish of `zyggy` per RID.
# Needs no repository secret: the implicit GITHUB_TOKEN is used only by the artefact upload.
name: ci

# Kept within the free private-repository Actions allowance (owner, 2026-10-06): a docs-only change runs nothing (tags
# always build), and a pull request runs only the Linux job; main and release tags run both runners.
on:
  push:
    branches: [main]
    # A release tag builds the artefacts Central installs: MinVer then versions them from the tag (spec 28, runbook 14a).
    tags: ['v*']
    paths-ignore: ['_plans/**', '_specs/**', 'evolution/**', 'memory/**', '**/*.md']
  pull_request:
    paths-ignore: ['_plans/**', '_specs/**', 'evolution/**', 'memory/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","rid":"linux-x64","exe":"zyggy","os-facts":"_OnLinux"}]' || '[{"os":"windows-latest","rid":"win-x64","exe":"zyggy.exe","os-facts":"_OnWindows"},{"os":"ubuntu-latest","rid":"linux-x64","exe":"zyggy","os-facts":"_OnLinux"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and height

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Zyggy.slnx

      - name: Build
        run: dotnet build Zyggy.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format Zyggy.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Zyggy.slnx -c Release --no-build --logger trx --results-directory TestResults

      # OS-specific facts skip themselves elsewhere, so a skip here would pass silently: fail unless every
      # test named *<os-facts>* ran and passed on its own runner. Writes the per-test outcome to the job summary.
      - name: Check OS-specific facts ran
        shell: pwsh
        run: |
          $results = Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            ([xml](Get-Content -LiteralPath $_.FullName -Raw)).TestRun.Results.UnitTestResult }
          $facts = @($results | Where-Object testName -like '*${{ matrix.os-facts }}*')
          "### OS-specific facts (${{ matrix.os }})" >> $env:GITHUB_STEP_SUMMARY
          $facts | ForEach-Object { "- $($_.outcome): $($_.testName)" } >> $env:GITHUB_STEP_SUMMARY
          if ($facts.Count -eq 0) { Write-Error 'no test matches ${{ matrix.os-facts }}'; exit 1 }
          $notPassed = @($facts | Where-Object outcome -ne 'Passed')
          if ($notPassed.Count -gt 0) { Write-Error "not passed: $($notPassed.testName -join ', ')"; exit 1 }

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Publish zyggy (${{ matrix.rid }})
        run: dotnet publish src/Zyggy.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}

      # Deliverable 07: the Node service ships next to the CLI (spec 07 AC-25).
      - name: Publish zyggy-node (${{ matrix.rid }})
        run: dotnet publish src/Zyggy.Node -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}

      # Deliverable 10: the deploy assets (Central's unit and credentials drop-in example, the laptops' unelevated installer,
      # their README) travel in the same artefact, under the same checksums (spec 10 AC-5).
      - name: Copy deploy assets (${{ matrix.rid }})
        shell: pwsh
        run: Copy-Item -Recurse deploy artifacts/${{ matrix.rid }}/deploy

      # sha256sum format (<64 lowercase hex>  <name>\n, LF) so Central can check the pinned binaries (spec 28) and, since
      # deliverable 10, every file under deploy/ by its relative name with / separators.
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $dir = 'artifacts/${{ matrix.rid }}'
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $deploy = Get-ChildItem -Recurse -File "$dir/deploy" | ForEach-Object {
            [IO.Path]::GetRelativePath((Resolve-Path $dir).Path, $_.FullName).Replace('\', '/') }
          $lines = foreach ($name in @('${{ matrix.exe }}', "zyggy-node$ext") + @($deploy)) {
            $hash = (Get-FileHash -LiteralPath "$dir/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name`n"
          }
          [IO.File]::WriteAllText("$dir/SHA256SUMS", ($lines -join ''))

      # Both binaries answer --version; their single-file sizes go to the step summary (the Gate A measurement of plan 07).
      - name: Smoke-run the published binaries
        shell: pwsh
        run: |
          $dir = 'artifacts/${{ matrix.rid }}'
          $ext = if ($IsWindows) { '.exe' } else { '' }
          "### Published binaries (${{ matrix.rid }})" >> $env:GITHUB_STEP_SUMMARY
          foreach ($name in @('${{ matrix.exe }}', "zyggy-node$ext")) {
            $out = & "$dir/$name" --version
            if ($LASTEXITCODE -ne 0) { Write-Error "$name --version exited $LASTEXITCODE"; exit 1 }
            if ("$out" -notmatch '^\d+\.\d+\.\d+') { Write-Error "unexpected version output from ${name}: $out"; exit 1 }
            $mb = [math]::Round((Get-Item -LiteralPath "$dir/$name").Length / 1MB, 1)
            "$name --version: $out ($mb MB)"
            "- ``$name`` $out — $mb MB" >> $env:GITHUB_STEP_SUMMARY
          }

      # Deliverable 10: a syntax error in the shipped installer fails the job on both runners (the CI half of spec 10 AC-2);
      # the script itself is never run here.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('deploy/windows/install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          "install.ps1 parsed: $($tokens.Count) tokens, 0 errors"

      - uses: actions/upload-artifact@v7
        with:
          name: zyggy-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
